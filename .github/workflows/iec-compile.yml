name: iec-compile-gate

# L2 真编译门：MatIEC 现场构建 + 全库解析/编译
# 触发：push / PR / 手动。
#
# 门禁口径（2026-11-26 修正，见 CHANGELOG v2.88.1）：
#   L1 = 顾问级（advisory），结论入报告不阻断；存量 BLOCK 由产线轮次清理。
#   L2 = 基线级（baseline），MatIEC 方言差异期只出通过率，不阻断。
#   ★ 任何一步「报告缺失」不得以 IndexError 形式让流水线失败——
#     这是 2026-11-25 master 构建失败的根因（dl_gate.py 硬编码 Windows 库根放大 + 裸 [-1] 取文件）。
on:
  push:
    paths: ["DL_*/**", "_tools/**", ".github/workflows/iec-compile.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  matiec:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex autoconf automake libtool git python3

      - name: Build MatIEC
        run: |
          git clone --depth 1 https://github.com/beremiz/matiec.git /tmp/matiec
          cd /tmp/matiec
          autoreconf -i >/dev/null 2>&1 || true
          ./configure >/dev/null
          make -j"$(nproc)"
          ls -l iec2c iec2iec || true

      - name: L1 static gate (advisory)
        continue-on-error: true
        run: |
          # dl_gate.py 自动解析库根（DAOLI_LIB > 脚本父目录 > C:\Library），Linux CI 下即仓库根
          python3 _tools/dl_gate.py --all --round CI-L1 || true
          python3 - <<'PY'
          import glob, json, sys
          from collections import Counter
          files = sorted(glob.glob('_Staging_Raw/*/_gate_CI-L1.json'))
          if not files:
              print("L1 report missing -> advisory step, not a CI failure.")
              print("Hint: verify dl_gate.py can resolve the library root on this runner.")
              sys.exit(0)
          d = json.load(open(files[-1]))
          total = d.get('total', 0); ok = d.get('pass', 0); blk = d.get('block', 0)
          rate = (100.0 * ok / total) if total else 0.0
          print("L1: %d PASS / %d  BLOCK %d  (%.1f%%)" % (ok, total, blk, rate))
          c = Counter()
          for r in d.get('results', []):
              if r.get('verdict') != 'BLOCK':
                  continue
              codes = [i['code'] for i in r.get('issues', []) if i.get('level') == 'BLOCK']
              for k in codes:
                  c[k] += 1
              print("  BLOCK", r.get('file'), codes[:3])
          if c:
              print("BLOCK codes:", dict(c))
          print("advisory only -> exit 0")
          PY

      - name: L2 MatIEC parse (iec2iec)
        run: |
          export IEC_PARSER=/tmp/matiec/iec2iec
          cp -r /tmp/matiec/lib ./lib   # iec2iec 从工作目录找 lib/ieclib.txt 标准库
          python3 _tools/matic_manifest.py --all --round CI-L2
          MAN="$(ls -t _Staging_Raw/*/_compile_CI-L2.json 2>/dev/null | head -1)"
          if [ -z "$MAN" ]; then
            echo "L2 manifest missing -> baseline step, not a CI failure."
            exit 0
          fi
          python3 _tools/matic_runner.py --manifest "$MAN" --round CI-L2 || true
          python3 - "$MAN" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print("manifest unreadable:", e); sys.exit(0)
          res = d.get('results') or d.get('items') or []
          tot = len(res) or d.get('total', 0)
          ok = 0
          for r in res:
              st = str(r.get('status', r.get('result', ''))).lower()
              if st in ('pass', 'ok', 'success'):
                  ok += 1
          print("L2 MatIEC baseline: %d/%d PASS" % (ok, tot))
          print("NOTE: MatIEC 与本地 RuSTy 方言差异期，本步仅出统计，不阻断。")
          PY

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            _Staging_Raw/*/_gate_*.json
            _Staging_Raw/*/_compile_*.json
          retention-days: 30
